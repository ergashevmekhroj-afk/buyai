# Netlify: build the React app in web/ and publish web/dist.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

# HTML is always re-checked; files in /assets have a content hash in their name, so they can be cached forever
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
